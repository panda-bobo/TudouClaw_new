<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a1a2e;
  display: flex; justify-content: center; align-items: center;
  height: 100vh; font-family: 'Segoe UI', system-ui, sans-serif;
}
.game-wrapper {
  text-align: center;
  background: #16213e;
  border-radius: 16px;
  padding: 24px;
  box-shadow: 0 8px 32px rgba(0,0,0,.4);
}
h1 {
  color: #e94560;
  font-size: 28px; margin-bottom: 8px;
  letter-spacing: 2px;
}
.score-panel {
  color: #0f3460;
  background: #e94560;
  display: inline-block;
  padding: 6px 20px;
  border-radius: 20px;
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 12px;
}
canvas {
  border: 2px solid #0f3460;
  border-radius: 8px;
  display: block; margin: 0 auto;
}
.controls {
  margin-top: 14px;
  color: #a0a0b0;
  font-size: 13px;
  display: flex; gap: 20px; justify-content: center; align-items: center;
}
button {
  background: #e94560;
  color: #fff;
  border: none;
  padding: 8px 24px;
  border-radius: 20px;
  cursor: pointer;
  font-size: 14px;
  font-weight: bold;
  transition: background .2s;
}
button:hover { background: #c73a54; }
</style>
</head>
<body>
<div class="game-wrapper">
  <h1>SNAKE</h1>
  <div class="score-panel">得分: <span id="scoreDisplay">0</span></div>
  <canvas id="gameCanvas"></canvas>
  <div class="controls">
    <span>方向键 / WASD 控制</span>
    <button id="restartBtn">重新开始</button>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreSpan = document.getElementById('scoreDisplay');

const GRID = 20;
const COLS = 20;
const ROWS = 20;
canvas.width = COLS * GRID;
canvas.height = ROWS * GRID;

let snake = [];
let food = { x: 0, y: 0 };
let dir = { x: 1, y: 0 };
let nextDir = { x: 1, y: 0 };
let score = 0;
let timer = null;
let gameOver = false;

function randInt(max) { return Math.floor(Math.random() * max); }

function spawnFood() {
  while (true) {
    food.x = randInt(COLS);
    food.y = randInt(ROWS);
    if (!snake.some(s => s.x === food.x && s.y === food.y)) break;
  }
}

function init() {
  const cx = Math.floor(COLS / 2);
  const cy = Math.floor(ROWS / 2);
  snake = [
    { x: cx, y: cy },
    { x: cx - 1, y: cy },
    { x: cx - 2, y: cy }
  ];
  dir = { x: 1, y: 0 };
  nextDir = { x: 1, y: 0 };
  score = 0;
  gameOver = false;
  scoreSpan.textContent = '0';
  spawnFood();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // food
  ctx.fillStyle = '#e94560';
  ctx.beginPath();
  ctx.arc(food.x * GRID + GRID / 2, food.y * GRID + GRID / 2, GRID / 2 - 2, 0, Math.PI * 2);
  ctx.fill();

  // snake
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#0f3460' : '#1a7a5a';
    ctx.fillRect(s.x * GRID + 1, s.y * GRID + 1, GRID - 2, GRID - 2);
  });

  if (gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#e94560';
    ctx.font = 'bold 28px "Segoe UI", system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('游戏结束', canvas.width / 2, canvas.height / 2 - 10);
    ctx.font = '16px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = '#fff';
    ctx.fillText('得分: ' + score + '  |  点击按钮重新开始', canvas.width / 2, canvas.height / 2 + 22);
  }
}

function update() {
  if (gameOver) return;
  dir = { ...nextDir };
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  // wall collision
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
    gameOver = true; draw(); return;
  }
  // self collision
  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    gameOver = true; draw(); return;
  }

  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    scoreSpan.textContent = score;
    spawnFood();
  } else {
    snake.pop();
  }
  draw();
  timer = setTimeout(update, 100);
}

document.addEventListener('keydown', e => {
  const key = e.key.toLowerCase();
  if (['arrowup', 'w'].includes(key) && dir.y !== 1) nextDir = { x: 0, y: -1 };
  if (['arrowdown', 's'].includes(key) && dir.y !== -1) nextDir = { x: 0, y: 1 };
  if (['arrowleft', 'a'].includes(key) && dir.x !== 1) nextDir = { x: -1, y: 0 };
  if (['arrowright', 'd'].includes(key) && dir.x !== -1) nextDir = { x: 1, y: 0 };
});

document.getElementById('restartBtn').addEventListener('click', () => {
  clearTimeout(timer);
  init();
  draw();
  timer = setTimeout(update, 100);
});

init();
draw();
timer = setTimeout(update, 100);
</script>
</body>
</html>
